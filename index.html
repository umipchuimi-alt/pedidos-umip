</style>

};
function save(){localStorage.setItem(section==='farmacia'?'uemip_farmacia_pedido_v1':'uemip_sueros_pedido_v1',JSON.stringify(states[section]));}
function home(){
 section=null;only=false;
 document.getElementById('app').innerHTML=`
 <div class="home">
  <div class="card" onclick="openSection('farmacia')"><div class="icon">💊</div><div class="title">FARMACIA</div><div class="desc">Medicamentos y artículos del botiquín</div></div>
  <div class="card" onclick="openSection('sueros')"><div class="icon">💧</div><div class="title">SUEROS</div><div class="desc">Sueros, soluciones, agua, glucosa y otros fluidos</div></div>
 </div>`;
}
function openSection(s){section=s;only=false;renderSection();}
function renderSection(){
 const data=DATA[section], st=states[section], app=document.getElementById('app');
 app.innerHTML=`<button class="back" onclick="home()">← Volver</button>
 <h2 style="margin:4px 0 0">${section==='farmacia'?'💊 Farmacia':'💧 Sueros'}</h2>
 <div class="sub">${section==='farmacia'?'Planta 1 MIP General (3UMI-PG)':'Planta 1 MIP Sueros (3UMI-S)'} · Pacto de reposición · 10/09/2026</div>
 <input id="search" class="search" placeholder="🔎 Buscar..." autocomplete="off">
 <div class="toolbar"><button class="btn" id="only">${only?'Mostrar todos':'Solo con pedido'}</button><button class="btn" id="clear">Limpiar cantidades</button></div>
 <div id="list"></div><div id="empty" class="empty">No hay artículos que coincidan.</div>
 <div class="bottom"><div class="count" id="count"></div><button class="primary" id="generate">GENERAR PEDIDO</button></div>`;
 document.getElementById('search').oninput=draw;
 document.getElementById('only').onclick=()=>{only=!only;renderSection()};
 document.getElementById('clear').onclick=()=>{if(confirm('¿Borrar todas las cantidades anotadas en esta lista?')){states[section]={};save();renderSection()}};
 document.getElementById('generate').onclick=generate;
 draw();
}
function draw(){
 const q=document.getElementById('search').value.trim().toLowerCase(),box=document.getElementById('list'),data=DATA[section],st=states[section];box.innerHTML='';let vis=0;
 data.forEach(x=>{if(q&&!(x.name+' '+x.code).toLowerCase().includes(q))return;if(only&&!(st[x.i]>0))return;vis++;
 let el=document.createElement('div');el.className='item';el.innerHTML=`<div class="info"><div class="name">${x.name}</div><div class="meta">${x.code?x.code+' · ':''}Pacto: ${x.pact??'—'}</div></div><div class="step"><button aria-label="Restar una unidad">−</button><input class="qty" type="number" min="0" step="1" inputmode="numeric" value="${st[x.i]||0}" aria-label="Cantidad a pedir"><button aria-label="Añadir una unidad">+</button></div>`;
 let b=el.querySelectorAll('button'),inp=el.querySelector('.qty');b[0].onclick=()=>change(x.i,-1);b[1].onclick=()=>change(x.i,1);inp.oninput=()=>setQty(x.i,inp.value);inp.onblur=()=>normalizeQty(x.i,inp);inp.onfocus=()=>inp.select();box.appendChild(el)});
 document.getElementById('empty').style.display=vis?'none':'block';updateCount();
}
function change(i,d){states[section][i]=Math.max(0,(states[section][i]||0)+d);if(!states[section][i])delete states[section][i];save();draw();}
function setQty(i,v){
 let n=parseInt(String(v).replace(/[^0-9]/g,''),10);
 if(!Number.isFinite(n)||n<=0) delete states[section][i];
 else states[section][i]=n;
 save();
 updateCount();
}
function normalizeQty(i,inp){
 let n=parseInt(String(inp.value).replace(/[^0-9]/g,''),10);
 if(!Number.isFinite(n)||n<=0){delete states[section][i];inp.value=0}
 else{states[section][i]=n;inp.value=n}
 save();
 updateCount();
}
function updateCount(){let st=states[section],n=Object.keys(st).filter(k=>st[k]>0).length,u=Object.values(st).reduce((a,b)=>a+b,0);document.getElementById('count').textContent=`${n} artículos · ${u} uds.`}
function generate(){
 const data=DATA[section],st=states[section],c=data.filter(x=>st[x.i]>0);
 if(!c.length){alert('Todavía no has indicado nada que pedir.');return}
 const titulo=section==='farmacia'?'FARMACIA':'SUEROS',planta=section==='farmacia'?'Planta 1 MIP General (3UMI-PG)':'Planta 1 MIP Sueros (3UMI-S)';
 document.getElementById('dlgTitle').textContent='🧾 Pedido de '+titulo;
 document.getElementById('order').textContent=`PEDIDO DE ${titulo} · UEMIP\n${planta}\n\n`+c.map((x,j)=>`${j+1}. ${x.name} — ${st[x.i]} ud.`).join('\n')+`\n\nTOTAL: ${c.length} artículos · ${c.reduce((a,x)=>a+st[x.i],0)} unidades`;
 document.getElementById('dlg').showModal();
}
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('order').textContent);document.getElementById('copy').textContent='✓ Copiado';setTimeout(()=>document.getElementById('copy').textContent='Copiar lista',1200)}catch(e){alert('No se pudo copiar automáticamente.')}};
