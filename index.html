const API_URL='https://script.google.com/macros/s/AKfycbxno1fO16lJ8FiUDlk5AO5IXmL9jv47MLFpIusR6zARSXE0gJ7RXgr-in2DnxZnBOWMvA/exec';

async function loadShared(){
 try{let r=await fetch(API_URL,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);sharedRows=await r.json();if(!Array.isArray(sharedRows))sharedRows=[];document.getElementById('sharedStatus').textContent='☁️ Listado compartido actualizado';drawShared();}
 catch(e){console.error(e);sharedRows=[];document.getElementById('sharedStatus').textContent='⚠️ No se pudo conectar con el listado compartido. Comprueba que la implementación de Apps Script esté activa.';drawShared();}
}
function catalogItem(row){
 const all=allCatalog();
 return all.find(x=>x.section===String(row.seccion).toUpperCase()&&x.name===String(row.articulo))||{section:String(row.seccion).toUpperCase(),name:String(row.articulo),code:''};
}
function drawShared(){
 const q=(document.getElementById('search')?.value||'').trim().toLowerCase(),box=document.getElementById('list');if(!box)return;box.innerHTML='';let vis=0;
 const selected=new Map(sharedRows.map(r=>[String(r.seccion).toUpperCase()+'|'+String(r.articulo),Number(r.cantidad)||0]));
 allCatalog().forEach((x)=>{
   const key=x.section+'|'+x.name; const qty=selected.get(key)||0;
   if(sharedFilter!=='TODAS'&&x.section!==sharedFilter)return;
   if(q&&!(x.name+' '+x.code+' '+x.section).toLowerCase().includes(q))return;

   const el=document.createElement('div');el.className='item';el.innerHTML=`<div class="info"><div class="sharedTag">${x.section}</div><div class="name">${x.name}</div><div class="meta">${x.code||''}</div></div><div class="step"><button aria-label="Restar una unidad">−</button><input class="qty" type="number" min="0" step="1" inputmode="numeric" value="${qty}" aria-label="Cantidad de falta"><button aria-label="Añadir una unidad">+</button></div>`;
   const bs=el.querySelectorAll('button'),inp=el.querySelector('.qty');bs[0].onclick=()=>changeShared(x,-1);bs[1].onclick=()=>changeShared(x,1);inp.oninput=()=>setShared(x,inp.value);inp.onblur=()=>normalizeShared(x,inp);inp.onfocus=()=>inp.select();box.appendChild(el);
 });
 document.getElementById('shown').textContent=`${vis} artículos`;document.getElementById('empty').style.display=vis?'none':'block';document.getElementById('count').textContent=`${sharedRows.filter(r=>Number(r.cantidad)>0).length} con falta · ${sharedRows.reduce((a,r)=>a+(Number(r.cantidad)||0),0)} uds.`;
}
function sharedKey(x){return String(x.section).toUpperCase()+'|'+x.name}
const sharedTimers=new Map();
async function postShared(payload,redraw=true){
 document.getElementById('sharedStatus').textContent='⏳ Guardando...';
 try{
   const qs=new URLSearchParams();
   Object.entries(payload).forEach(([k,v])=>qs.set(k,String(v)));
   const r=await fetch(API_URL+'?'+qs.toString(),{method:'GET',cache:'no-store'});
   if(!r.ok)throw new Error('HTTP '+r.status);
   const data=await r.json();
   sharedRows=Array.isArray(data)?data:sharedRows;
   document.getElementById('sharedStatus').textContent='☁️ Guardado';
   if(redraw)drawShared();
   return true;
 }catch(e){console.error(e);document.getElementById('sharedStatus').textContent='⚠️ No se pudo guardar. Revisa la conexión.';return false;}
}
function currentSharedQty(x){const r=sharedRows.find(r=>sharedKey({section:r.seccion,name:r.articulo})===sharedKey(x));return r?Number(r.cantidad)||0:0}
function applyLocalShared(x,n){
 const key=sharedKey(x); const idx=sharedRows.findIndex(r=>String(r.seccion).toUpperCase()+'|'+String(r.articulo)===key);
 if(n>0){ if(idx>=0) sharedRows[idx].cantidad=n; else sharedRows.push({seccion:x.section,articulo:x.name,cantidad:n}); }
 else if(idx>=0) sharedRows.splice(idx,1);
}
function scheduleSharedSave(x,n){
 const key=sharedKey(x); clearTimeout(sharedTimers.get(key));
 sharedTimers.set(key,setTimeout(()=>{sharedTimers.delete(key);postShared(n>0?{accion:'guardar',seccion:x.section,articulo:x.name,cantidad:n}:{accion:'borrar',seccion:x.section,articulo:x.name},false);},500));
}
function changeShared(x,d){
 const n=Math.max(0,currentSharedQty(x)+d);applyLocalShared(x,n);drawShared();scheduleSharedSave(x,n);
}
function setShared(x,v){
 let n=parseInt(String(v).replace(/[^0-9]/g,''),10); if(!Number.isFinite(n)||n<0)n=0;
 applyLocalShared(x,n);
 const countEl=document.getElementById('count'); if(countEl){const rows=sharedRows.filter(r=>Number(r.cantidad)>0);countEl.textContent=`${rows.length} con falta · ${rows.reduce((a,r)=>a+(Number(r.cantidad)||0),0)} uds.`;}
 scheduleSharedSave(x,n);
}
function normalizeShared(x,inp){
 let n=parseInt(String(inp.value).replace(/[^0-9]/g,''),10);if(!Number.isFinite(n)||n<=0)n=0;inp.value=n;
 const key=sharedKey(x);clearTimeout(sharedTimers.get(key));sharedTimers.delete(key);applyLocalShared(x,n);postShared(n>0?{accion:'guardar',seccion:x.section,articulo:x.name,cantidad:n}:{accion:'borrar',seccion:x.section,articulo:x.name});
}
async function flushPendingShared(){
 const pending=[]; sharedTimers.forEach((timer,key)=>{clearTimeout(timer);sharedTimers.delete(key);const [sec,...rest]=key.split('|');const name=rest.join('|');const r=sharedRows.find(row=>String(row.seccion).toUpperCase()===sec&&String(row.articulo)===name);pending.push({accion:r&&Number(r.cantidad)>0?'guardar':'borrar',seccion:sec,articulo:name,cantidad:r?Number(r.cantidad)||0:0});});
 for(const p of pending) await postShared(p,false);
}
async function clearShared(){if(!confirm('¿Vaciar todas las faltas de la semana?'))return;await flushPendingShared();await postShared({accion:'limpiar'});}
async function generateShared(){
 await flushPendingShared(); await loadShared();
 const rows=sharedRows.filter(r=>Number(r.cantidad)>0).sort((a,b)=>String(a.seccion).localeCompare(String(b.seccion))||String(a.articulo).localeCompare(String(b.articulo)));
 if(!rows.length){alert('Todavía no hay faltas anotadas.');return;}
 const lines=[];['FARMACIA','SUEROS','FUNGIBLE'].forEach(sec=>{const rs=rows.filter(r=>String(r.seccion).toUpperCase()===sec);if(rs.length){lines.push('\n'+sec);rs.forEach((r,i)=>lines.push(`${i+1}. ${r.articulo} — ${Number(r.cantidad)} ud.`));}});
 document.getElementById('dlgTitle').textContent='🧾 Listado semanal de faltas';document.getElementById('order').textContent='LISTADO SEMANAL DE FALTAS · UEMIP\n\n'+lines.join('\n')+`\n\nTOTAL: ${rows.length} artículos · ${rows.reduce((a,r)=>a+(Number(r.cantidad)||0),0)} unidades`;document.getElementById('dlg').showModal();
}
function draw(){
 let q=document.getElementById('search').value.trim().toLowerCase(),box=document.getElementById('list'),data=section==='fungible'?FUNGIBLE:DATA[section],st=states[section];box.innerHTML='';let vis=0;
 data.forEach((x,i)=>{let idx=section==='fungible'?i:x.i;if(q&&!((x.name+' '+(x.code||'')+' '+(x.desc||'')+' '+(x.z||'')).toLowerCase().includes(q)))return;if(only&&!(st[idx]>0))return;vis++;
 let meta=section==='fungible'?`${x.z||''}${x.ref?' · Ref: '+x.ref:''}${x.cat?' · Cat: '+x.cat:''}`: `${x.code||''} · Pacto: ${x.pact??'—'}`;
 let extra=section==='fungible'?`${x.desc||''}${x.max?' · Máx: '+x.max:''}${x.umb?' · Umbral: '+x.umb:''}${x.loc?' · 📍 '+x.loc:''}`:''; 
 let el=document.createElement('div');el.className='item';el.innerHTML=`<div class="info"><div class="name">${x.name}</div><div class="meta">${meta}</div>${extra?'<div class="desc">'+extra+'</div>':''}</div><div class="step"><button aria-label="Restar una unidad">−</button><input class="qty" type="number" min="0" step="1" inputmode="numeric" value="${st[idx]||0}" aria-label="Cantidad a pedir"><button aria-label="Añadir una unidad">+</button></div>`;
 let bs=el.querySelectorAll('button'),inp=el.querySelector('.qty');bs[0].onclick=()=>change(idx,-1);bs[1].onclick=()=>change(idx,1);inp.oninput=()=>setQty(idx,inp.value);inp.onblur=()=>normalizeQty(idx,inp);inp.onfocus=()=>inp.select();box.appendChild(el);});
 document.getElementById('shown').textContent=`${vis} materiales/artículos`;document.getElementById('empty').style.display=vis?'none':'block';updateCount();
}
function change(i,d){states[section][i]=Math.max(0,(states[section][i]||0)+d);if(!states[section][i])delete states[section][i];save();draw();}
function setQty(i,v){let n=parseInt(String(v).replace(/[^0-9]/g,''),10);if(!Number.isFinite(n)||n<=0)delete states[section][i];else states[section][i]=n;save();updateCount();}
function normalizeQty(i,inp){let n=parseInt(String(inp.value).replace(/[^0-9]/g,''),10);if(!Number.isFinite(n)||n<=0){delete states[section][i];inp.value=0}else{states[section][i]=n;inp.value=n}save();updateCount();}
function updateCount(){let st=states[section],n=Object.keys(st).filter(k=>st[k]>0).length,u=Object.values(st).reduce((a,b)=>a+b,0);document.getElementById('count').textContent=`${n} seleccionados · ${u} uds.`;}
function generate(){
 let data=section==='fungible'?FUNGIBLE:DATA[section],st=states[section],c=data.filter((x,i)=>(st[section==='fungible'?i:x.i]>0));if(!c.length){alert('Todavía no has indicado nada que pedir.');return}
 let titulo=section==='farmacia'?'FARMACIA':section==='sueros'?'SUEROS':'FUNGIBLE',sub=section==='farmacia'?'Planta 1 MIP General (3UMI-PG)':section==='sueros'?'Planta 1 MIP Sueros (3UMI-S)':'Catálogo de fungible · Supervisión';
 let lines=c.map((x,j)=>`${j+1}. ${x.name} — ${st[section==='fungible'?data.indexOf(x):x.i]} ud.`).join('\n');
 document.getElementById('dlgTitle').textContent='🧾 Pedido de '+titulo;document.getElementById('order').textContent=`PEDIDO DE ${titulo} · UEMIP\n${sub}\n\n`+lines+`\n\nTOTAL: ${c.length} artículos · ${c.reduce((a,x)=>a+st[section==='fungible'?data.indexOf(x):x.i],0)} unidades`;document.getElementById('dlg').showModal();
}
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('order').textContent);document.getElementById('copy').textContent='✓ Copiado';setTimeout(()=>document.getElementById('copy').textContent='📋 Copiar lista',1200)}catch(e){alert('No se pudo copiar automáticamente.')}};
document.getElementById('pdf').onclick=()=>{
 if(section==='faltas'){
  const rows=sharedRows.filter(r=>Number(r.cantidad)>0).sort((a,b)=>String(a.seccion).localeCompare(String(b.seccion))||String(a.articulo).localeCompare(String(b.articulo)));
  if(!rows.length){alert('Todavía no hay faltas anotadas.');return;}
  const fecha=new Date().toLocaleDateString('es-ES');
  let body='';
  ['FARMACIA','SUEROS','FUNGIBLE'].forEach(sec=>{const rs=rows.filter(r=>String(r.seccion).toUpperCase()===sec);if(rs.length){body+=`<tr class="sectionRow"><th colspan="2">${sec}</th></tr>`;rs.forEach(r=>body+=`<tr><td>${r.articulo}</td><td>${Number(r.cantidad)}</td></tr>`);}});
  document.getElementById('printArea').innerHTML=`<h1>LISTADO SEMANAL DE FALTAS · UEMIP</h1><div class="printSub">Fecha de generación: ${fecha}</div><table><thead><tr><th>Artículo</th><th>Cantidad</th></tr></thead><tbody>${body}</tbody></table><div class="total">TOTAL: ${rows.length} artículos · ${rows.reduce((a,r)=>a+(Number(r.cantidad)||0),0)} unidades</div>`;
  dlg.close();setTimeout(()=>window.print(),100);return;
 }
 let data=section==='fungible'?FUNGIBLE:DATA[section],st=states[section],c=data.filter((x,i)=>st[section==='fungible'?i:x.i]>0),titulo=section==='farmacia'?'FARMACIA':section==='sueros'?'SUEROS':'FUNGIBLE',sub=section==='farmacia'?'Planta 1 MIP General (3UMI-PG)':section==='sueros'?'Planta 1 MIP Sueros (3UMI-S)':'Catálogo de fungible · Supervisión',fecha=new Date().toLocaleDateString('es-ES');
 document.getElementById('printArea').innerHTML=`<h1>PEDIDO DE ${titulo} · UEMIP</h1><div class="printSub">${sub} · Fecha: ${fecha}</div><table><thead><tr><th>Artículo</th><th>Cantidad</th></tr></thead><tbody>${c.map((x,i)=>`<tr><td>${x.name}${section==='fungible'?(x.z?' · '+x.z:''):(x.code?' · '+x.code:'')}</td><td>${st[section==='fungible'?data.indexOf(x):x.i]}</td></tr>`).join('')}</tbody></table><div class="total">TOTAL: ${c.length} artículos · ${c.reduce((a,x)=>a+st[section==='fungible'?data.indexOf(x):x.i],0)} unidades</div>`;
 dlg.close();setTimeout(()=>window.print(),100);
};
home();
</script>
